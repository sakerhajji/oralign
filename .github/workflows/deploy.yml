# ─────────────────────────────────────────────────────────────────
# Deploy to production — MANUAL ONLY.
#
# A push to main never deploys. The owner starts this workflow
# (Actions → Deploy to production → Run workflow). It:
#   1. resolves the commit (latest main unless a SHA is given),
#   2. refuses it unless the CI workflow passed on that exact commit,
#   3. waits for the approval of the "production" environment
#      (Settings → Environments → production → Required reviewers),
#   4. on the VPS: backup (Postgres + uploads), then scripts/deploy.sh,
#      which checks out exactly that commit, builds, migrates and
#      health-checks,
#   5. smoke-tests the public site and API.
# Rollback: the "Rollback production" workflow. Setup: docs/ci-cd.md.
# ─────────────────────────────────────────────────────────────────
name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (full SHA). Empty = latest main.
        required: false
        default: ''
      skip_backup:
        description: Skip the pre-deploy backup (not recommended)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  checks: read

# Never two deploys at once, and never cancel one half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    name: CI must be green for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve the commit
        id: resolve
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha="${INPUT_SHA:-$(git rev-parse origin/main)}"
          git cat-file -e "${sha}^{commit}" || { echo "::error::Unknown commit ${sha}"; exit 1; }
          git merge-base --is-ancestor "${sha}" origin/main \
            || { echo "::error::${sha} is not on main: only main is deployed"; exit 1; }
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Deploying $(git log -1 --format='%h %s' "${sha}")" >> "$GITHUB_STEP_SUMMARY"

      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')
          echo "CI on ${SHA:0:12}: ${conclusion}"
          [ "${conclusion}" = "success" ] \
            || { echo "::error::CI is '${conclusion}' for ${SHA:0:12}. Deploy a commit whose CI passed."; exit 1; }

  deploy:
    name: Deploy on the VPS
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://oralign.com.tn
    steps:
      # The SSH step used to die in ~4 s with no hint. Say what is wrong
      # (never the values) before trying.
      - name: Check the deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret ${name} is empty or missing"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          case "$VPS_SSH_KEY" in
            *"BEGIN OPENSSH PRIVATE KEY"*|*"BEGIN RSA PRIVATE KEY"*|*"BEGIN EC PRIVATE KEY"*) echo "Key header OK" ;;
            *) echo "::error::VPS_SSH_KEY is not a private key (paste the whole file, BEGIN/END lines included)"; exit 1 ;;
          esac
          case "$VPS_SSH_KEY" in
            *"ENCRYPTED"*) echo "::error::VPS_SSH_KEY has a passphrase: generate a deploy key without one"; exit 1 ;;
          esac

      - name: Backup, then deploy ${{ needs.gate.outputs.sha }}
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
          SKIP_BACKUP: ${{ inputs.skip_backup }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DEPLOY_SHA,SKIP_BACKUP
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd /opt/oralign-app
            if [ "${SKIP_BACKUP}" != "true" ]; then
              bash scripts/backup.sh
            fi
            DEPLOY_SHA="${DEPLOY_SHA}" bash scripts/deploy.sh

      - name: Smoke test — site and API
        run: |
          for url in https://oralign.com.tn https://api.oralign.com.tn/api/health; do
            ok=0
            for i in $(seq 1 12); do
              if curl -fsS -o /dev/null "$url"; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = 1 ] && echo "✓ $url" || { echo "::error::$url does not answer"; exit 1; }
          done
          echo "Deployed ${{ needs.gate.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
