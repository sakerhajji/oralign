# ─────────────────────────────────────────────────────────────────
# Production overlay — apply on top of docker-compose.yml:
#
#   docker compose \
#     --env-file .env.production \
#     -f docker-compose.yml \
#     -f docker-compose.production.yml \
#     up -d
#
# Differences vs base compose:
#   • Postgres + Redis host port mappings are REPLACED with empty
#     (using `!override`) so neither is reachable from the host;
#     backend reaches them via Docker's internal network.
#   • Backend `env_file` is REPLACED with empty so the dev-only
#     .env.docker is not required in production. All env comes from
#     --env-file .env.production via ${...} substitution below.
#   • Backend command runs `prisma migrate deploy` (idempotent,
#     non-destructive) instead of the dev `db push --accept-data-loss`
#     baked into the Dockerfile.
#   • Backend / frontend host port mappings bind 127.0.0.1 only.
#   • Persistent state uses host bind mounts under /var/lib/oralign-app
#     so backups are plain `tar` and uploads survive image rebuilds.
#   • prisma-studio is removed (dev tool).
#
# `!override` requires Compose 2.24+ (Docker Engine 25+). The VPS has
# Docker 29 / Compose v5, both safely past that.
# ─────────────────────────────────────────────────────────────────

services:
  postgres:
    # Replace the base's "5432:5432" mapping with no host binding.
    # The DB is only reachable via the oralign-network internal DNS.
    ports: !override []
    volumes:
      - ${POSTGRES_HOST_DIR:?POSTGRES_HOST_DIR not set}:/var/lib/postgresql/data

  redis:
    ports: !override []

  backend:
    # Replace the base's `env_file: - .env.docker` (file is dev-only).
    # All env is supplied via `--env-file .env.production` + the
    # `environment:` block below (which is merged with the base block).
    env_file: !override []

    # Production-safe migration: applies pending migrations from
    # prisma/migrations/, never drops data. Idempotent.
    command: >
      sh -c "node node_modules/.bin/prisma migrate deploy &&
             node dist/src/main"

    # Vars NOT already declared in the base compose's environment
    # block (MAIL_*) need to be re-injected here since we removed
    # env_file. ${...} substitutions read from .env.production.
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}

    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${UPLOADS_HOST_DIR:?UPLOADS_HOST_DIR not set}:/app/uploads

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:3001"

  # The dev-only `prisma-studio` service from the base compose is not
  # included in production. Run it on demand from a dev workstation
  # via `docker exec` against the running postgres container, or via
  # an SSH tunnel after temporarily exposing 5432 in a side overlay.
