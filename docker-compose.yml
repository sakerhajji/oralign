name: oralign-app

services:
  postgres:
    image: postgres:17-alpine
    container_name: oralign-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-oralign}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oralign_secure_password}
      POSTGRES_DB: ${DB_NAME:-oralign_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-oralign} -d ${DB_NAME:-oralign_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - oralign-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: oralign-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oralign-network
    restart: unless-stopped

  backend:
    build:
      context: ./oralign-backend
      dockerfile: Dockerfile
    container_name: oralign-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # .env supplies MAIL_* and other local settings; explicit environment
    # block overrides only the values that are computed at compose-time
    # (DATABASE_URL, REDIS_*, etc.).
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${DB_USER:-oralign}:${DB_PASSWORD:-oralign_secure_password}@postgres:5432/${DB_NAME:-oralign_db}
      HTTP_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-in-production}
      JWT_RESET_SECRET: ${JWT_RESET_SECRET:-change-me-reset-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_password}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - oralign-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./oralign-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Oralign}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
    container_name: oralign-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Oralign}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
    ports:
      - "3001:3001"
    networks:
      - oralign-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Dev tools (not started by default) ───────────────────────────────────────
  # Run with: docker compose --profile tools up prisma-studio
  prisma-studio:
    build:
      context: ./oralign-backend
      dockerfile: Dockerfile
      target: builder          # builder stage has full node_modules + prisma CLI
    command: npx prisma studio --port 5555 --browser none
    environment:
      DATABASE_URL: postgresql://${DB_USER:-oralign}:${DB_PASSWORD:-oralign_secure_password}@postgres:5432/${DB_NAME:-oralign_db}
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oralign-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  oralign-network:
    driver: bridge
