# /etc/nginx/sites-available/api.oralign.com.tn
#
# Backend — NestJS on 127.0.0.1:3000.
#
# After placing the file:
#   sudo ln -s /etc/nginx/sites-available/api.oralign.com.tn \
#              /etc/nginx/sites-enabled/api.oralign.com.tn
#   sudo nginx -t
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d api.oralign.com.tn

server {
    listen 80;
    listen [::]:80;
    server_name api.oralign.com.tn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.oralign.com.tn;

    ssl_certificate     /etc/letsencrypt/live/api.oralign.com.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.oralign.com.tn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/api.oralign.com.tn.access.log;
    error_log  /var/log/nginx/api.oralign.com.tn.error.log warn;

    # ── Large file uploads (STL / CBCT / ZIP) ─────────────────────
    # 1 GB cap mirrors the backend's MAX_FILE_SIZE_ZIP_BUNDLE_BYTES
    # for CBCT / DICOM bundles. Most uploads are far smaller (clinical
    # photos under 10 MB), so the larger limit only matters on the
    # ZIP-category endpoint and is otherwise dormant.
    #
    # Timeouts bumped to 15 min — a 1 GB upload over a 5 Mbit/s
    # clinic connection takes roughly 27 min in the worst case, but
    # 15 min covers the realistic 30–50 Mbit/s case with plenty of
    # headroom for retries. Pushing past 15 min routinely should be
    # a sign that we need resumable uploads (tus / chunked), not a
    # longer timeout.
    client_max_body_size 1024m;
    client_body_timeout  900s;
    proxy_read_timeout   900s;
    proxy_send_timeout   900s;

    # ── CORS — handled at the application layer (Nest CORS), but
    #    we also block obviously hostile requests at the edge.
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)$) {
        return 405;
    }

    # ── WebSocket — Socket.IO real-time gateways ─────────────────────
    # Support chat, treatment chat and the dashboard all connect over
    # Socket.IO, which mounts every namespace under the default
    # `/socket.io/` path. The handshake upgrades HTTP → WebSocket, and
    # that ONLY works if nginx forwards the Upgrade/Connection headers —
    # the plain `location /` below omits them, so without this block the
    # WS transport fails and real-time silently dies (clients are forced
    # onto long-polling at best, or never connect at all). Keep this
    # block ABOVE `location /` so the socket path matches first.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Long-lived connection — don't let nginx time it out at the
        # default 60s, and don't buffer the event stream.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Buffer off so streaming responses (downloads) work
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
