# /etc/nginx/sites-available/api.oralign.com.tn
#
# Backend — NestJS on 127.0.0.1:3000.
#
# After placing the file:
#   sudo ln -s /etc/nginx/sites-available/api.oralign.com.tn \
#              /etc/nginx/sites-enabled/api.oralign.com.tn
#   sudo nginx -t
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d api.oralign.com.tn

server {
    listen 80;
    listen [::]:80;
    server_name api.oralign.com.tn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.oralign.com.tn;

    ssl_certificate     /etc/letsencrypt/live/api.oralign.com.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.oralign.com.tn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/api.oralign.com.tn.access.log;
    error_log  /var/log/nginx/api.oralign.com.tn.error.log warn;

    # ── Large file uploads (STL / CBCT / ZIP) ─────────────────────
    # Adjust if a single upload may exceed 256 MB.
    client_max_body_size 256m;
    client_body_timeout  300s;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    # ── CORS — handled at the application layer (Nest CORS), but
    #    we also block obviously hostile requests at the edge.
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)$) {
        return 405;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Buffer off so streaming responses (downloads) work
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
