# /etc/nginx/sites-available/api.oralign.com.tn
#
# Backend — NestJS on 127.0.0.1:3000.
#
# After placing the file:
#   sudo ln -s /etc/nginx/sites-available/api.oralign.com.tn \
#              /etc/nginx/sites-enabled/api.oralign.com.tn
#   sudo nginx -t
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d api.oralign.com.tn

server {
    server_tokens off;  # audit I-5: hide nginx version
    listen 80;
    listen [::]:80;
    server_name api.oralign.com.tn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    server_tokens off;  # audit I-5: hide nginx version
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.oralign.com.tn;

    ssl_certificate     /etc/letsencrypt/live/api.oralign.com.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.oralign.com.tn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/api.oralign.com.tn.access.log;
    error_log  /var/log/nginx/api.oralign.com.tn.error.log warn;

    # ── Large file uploads (STL / CBCT / ZIP) ─────────────────────
    # 1 GB cap mirrors the backend's MAX_FILE_SIZE_ZIP_BUNDLE_BYTES
    # for CBCT / DICOM bundles. Most uploads are far smaller (clinical
    # photos under 10 MB), so the larger limit only matters on the
    # ZIP-category endpoint and is otherwise dormant.
    #
    # Timeouts bumped to 15 min — a 1 GB upload over a 5 Mbit/s
    # clinic connection takes roughly 27 min in the worst case, but
    # 15 min covers the realistic 30–50 Mbit/s case with plenty of
    # headroom for retries. Pushing past 15 min routinely should be
    # a sign that we need resumable uploads (tus / chunked), not a
    # longer timeout.
    client_max_body_size 1024m;
    client_body_timeout  900s;
    proxy_read_timeout   900s;
    proxy_send_timeout   900s;

    # ── CORS — handled at the application layer (Nest CORS), but
    #    we also block obviously hostile requests at the edge.
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)$) {
        return 405;
    }

    # ── Edge error responses — JSON, never HTML ───────────────────────
    # This vhost serves an API: a browser-style error page here would
    # hand every client a chunk of HTML where it expects JSON, and the
    # frontend's `extractApiError()` would report "unexpected error"
    # instead of the real cause. So nginx answers in the SAME envelope
    # the Nest exception filter uses — {statusCode, message, errorCode,
    # timestamp} — for the failures Nest never gets to see.
    #
    # One named location per code so the distinction survives: 502 the
    # API process is down, 504 it is alive but too slow, 503 nginx
    # cannot reach it at all. Flattening them into a single code would
    # throw away exactly what makes an outage diagnosable.
    #
    # `proxy_intercept_errors` stays off: real 4xx/5xx FROM Nest are
    # already correctly-shaped JSON and must pass through untouched.
    error_page 502 @api_bad_gateway;
    error_page 503 @api_unavailable;
    error_page 504 @api_timeout;
    error_page 405 @api_method_not_allowed;
    error_page 413 @api_payload_too_large;

    # Two traps are handled in EVERY block below — both are silent:
    #
    #  1. `default_type` alone is not enough. `return <code> '<json>'`
    #     sends with no explicit content type, and nginx then resolves
    #     one from the request URI's EXTENSION first, falling back to
    #     default_type only when nothing matches. An error_page jump to
    #     a NAMED location does not recompute that extension, so a 502
    #     on /uploads/receipt.pdf would ship this JSON body labelled
    #     `application/pdf`. The empty `types { }` block clears the mime
    #     table for the location, which leaves default_type to win.
    #  2. add_header is inherited all-or-nothing: the moment a location
    #     declares ONE header, the four security headers from the server
    #     level vanish for that response (the same pitfall documented
    #     for /uploads/ below). They are therefore re-declared here.
    location @api_bad_gateway {
        types { }
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Retry-After 30 always;
        return 502 '{"statusCode":502,"message":"The API is temporarily unreachable.","errorCode":"UPSTREAM_UNAVAILABLE","timestamp":"$time_iso8601"}';
    }

    location @api_unavailable {
        types { }
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Retry-After 30 always;
        return 503 '{"statusCode":503,"message":"The API is temporarily unavailable.","errorCode":"SERVICE_UNAVAILABLE","timestamp":"$time_iso8601"}';
    }

    location @api_timeout {
        types { }
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        return 504 '{"statusCode":504,"message":"The API took too long to respond.","errorCode":"UPSTREAM_TIMEOUT","timestamp":"$time_iso8601"}';
    }

    location @api_method_not_allowed {
        types { }
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        return 405 '{"statusCode":405,"message":"Method not allowed.","errorCode":"METHOD_NOT_ALLOWED","timestamp":"$time_iso8601"}';
    }

    location @api_payload_too_large {
        types { }
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        return 413 '{"statusCode":413,"message":"The uploaded file exceeds the maximum allowed size.","errorCode":"PAYLOAD_TOO_LARGE","timestamp":"$time_iso8601"}';
    }

    # ── WebSocket — Socket.IO real-time gateways ─────────────────────
    # Support chat, treatment chat and the dashboard all connect over
    # Socket.IO, which mounts every namespace under the default
    # `/socket.io/` path. The handshake upgrades HTTP → WebSocket, and
    # that ONLY works if nginx forwards the Upgrade/Connection headers —
    # the plain `location /` below omits them, so without this block the
    # WS transport fails and real-time silently dies (clients are forced
    # onto long-polling at best, or never connect at all). Keep this
    # block ABOVE `location /` so the socket path matches first.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Long-lived connection — don't let nginx time it out at the
        # default 60s, and don't buffer the event stream.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── Uploaded files — framable by the frontend ────────────────────
    # The admin bank-transfer receipt dialog embeds /uploads/*.pdf in an
    # <iframe> from oralign.com.tn. The server-level `X-Frame-Options
    # "DENY"` above forbids that (Chrome renders a grey "sad document"
    # tile). nginx add_header is NOT inherited once a location declares
    # its own, so this block re-adds every hardening header EXCEPT XFO;
    # framing is governed by the backend's per-file CSP
    # `frame-ancestors 'self' <FRONTEND_URL>` instead (main.ts), which
    # only admits our own frontend. Keep this ABOVE `location /`.
    location /uploads/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Buffer off so streaming responses (downloads) work
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
