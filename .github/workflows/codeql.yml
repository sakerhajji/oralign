# Static security analysis (GitHub CodeQL) of the TypeScript code:
# injection, path traversal, unsafe redirects, prototype pollution…
# Findings appear under Security → Code scanning. Free for public
# repositories; on a private one it needs GitHub Advanced Security.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC: new queries against old code

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
