# /etc/nginx/sites-available/oralign.com.tn
#
# Frontend — Next.js standalone server on 127.0.0.1:3001.
# This file does NOT touch viewer.oralign.com.tn — its server block
# stays as-is in /etc/nginx/sites-available/viewer.oralign.com.tn.
#
# After placing the file:
#   sudo ln -s /etc/nginx/sites-available/oralign.com.tn \
#              /etc/nginx/sites-enabled/oralign.com.tn
#   sudo nginx -t
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d oralign.com.tn -d www.oralign.com.tn

# HTTP → HTTPS (certbot will manage this block once issued)
server {
    listen 80;
    listen [::]:80;
    server_name oralign.com.tn www.oralign.com.tn;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oralign.com.tn www.oralign.com.tn;

    # ── SSL — populated by certbot ────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/oralign.com.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oralign.com.tn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ──────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Geolocation must be allowed on this origin — the clinic registration
    # flow needs the browser's geolocation API for the "Use my location"
    # button. With an empty allowlist, browsers reject the API call before
    # they even prompt the user. We keep mic/camera locked down.
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    # ── Logging ───────────────────────────────────────────────────
    access_log /var/log/nginx/oralign.com.tn.access.log;
    error_log  /var/log/nginx/oralign.com.tn.error.log warn;

    # ── Compression ───────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/rss+xml application/xml application/x-font-ttf
        font/opentype image/svg+xml image/x-icon;

    # ── Body size — Next.js itself doesn't accept uploads; this is
    #    a small allowance for SSR forms, etc.
    client_max_body_size 10m;

    # ── Static immutable assets — long cache ──────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Everything else → Next.js standalone server ───────────────
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
